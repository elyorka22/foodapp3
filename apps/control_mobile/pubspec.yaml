name: control_mobile
description: FoodApp Control — SUPER_ADMIN administrative app (Android + Web).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  # Android: Cronet (Chrome stack) so HTTPS works with VPN/proxy like the browser.
  # dart:io HttpClient often aborts behind VPN while Chrome succeeds.
  native_dio_adapter: ^1.7.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  google_fonts: ^6.3.0

# Pin Android implementation to avoid Pigeon/NoSuchMethodError getAll mismatches
# seen on some release APKs (SharedPreferencesApiRegistrar.getAll).
dependency_overrides:
  shared_preferences_android: 2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
