name: Customer Mobile APK

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/customer_mobile/**'
      - '.github/workflows/customer-mobile-apk.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/customer_mobile/**'
      - '.github/workflows/customer-mobile-apk.yml'
  workflow_dispatch:

concurrency:
  group: customer-mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer_mobile

    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      WS_BASE_URL: ${{ secrets.WS_BASE_URL }}
      TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build environment
        run: chmod +x scripts/validate_build_env.sh && ./scripts/validate_build_env.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('apps/customer_mobile/pubspec.yaml') }}

      - name: Create Android platform project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_CUSTOMER }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_CUSTOMER_B64 }}
        run: |
          flutter create . --org com.foodapp --project-name customer_mobile --platforms=android
          chmod +x scripts/patch_android_permissions.sh scripts/patch_android_app_name.sh scripts/setup_firebase_android.sh || true
          ./scripts/patch_android_permissions.sh || true
          ./scripts/patch_android_app_name.sh || true
          ./scripts/setup_firebase_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x scripts/configure_android_signing.sh && ./scripts/configure_android_signing.sh

      - name: Print configured release keystore fingerprints
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: chmod +x scripts/print_android_signing_sha1.sh && ./scripts/print_android_signing_sha1.sh

      - name: Apply launcher icons
        run: chmod +x scripts/apply_app_icons.sh && ./scripts/apply_app_icons.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK and App Bundle (Play Store)
        run: |
          DART_DEFINES=(
            "--dart-define=API_BASE_URL=${API_BASE_URL}"
            "--dart-define=WS_BASE_URL=${WS_BASE_URL}"
            "--dart-define=ENABLE_FCM=true"
            "--dart-define=GOOGLE_WEB_CLIENT_ID=278845357182-7ell2g4o06h42phpkl07jr7pjq2q2gug.apps.googleusercontent.com"
          )
          if [[ -n "${TELEGRAM_BOT_USERNAME:-}" ]]; then
            DART_DEFINES+=("--dart-define=TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}")
          fi
          flutter build apk --release "${DART_DEFINES[@]}"
          flutter build appbundle --release "${DART_DEFINES[@]}"

      - name: Print signed APK fingerprints
        run: chmod +x scripts/print_android_signing_sha1.sh && ./scripts/print_android_signing_sha1.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodapp-customer-apk
          path: apps/customer_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload App Bundle artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: foodapp-customer-aab
          path: apps/customer_mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
