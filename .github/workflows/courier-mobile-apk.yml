name: Courier Mobile APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/courier_mobile/**'
      - '.github/workflows/courier-mobile-apk.yml'
  workflow_dispatch:

concurrency:
  group: courier-mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/courier_mobile

    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      WS_BASE_URL: ${{ secrets.WS_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build environment
        run: chmod +x scripts/validate_build_env.sh && ./scripts/validate_build_env.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('apps/courier_mobile/pubspec.yaml') }}

      - name: Create Android platform project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_COURIER }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_COURIER_B64 }}
        run: |
          flutter create . --org com.foodapp --project-name courier_mobile --platforms=android --no-overwrite
          chmod +x scripts/patch_android_permissions.sh scripts/setup_firebase_android.sh
          ./scripts/patch_android_permissions.sh
          ./scripts/setup_firebase_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK and App Bundle
        run: |
          API_URL="$(printf '%s' "${API_BASE_URL}" | tr -d '[:space:]')"
          WS_URL="$(printf '%s' "${WS_BASE_URL}" | tr -d '[:space:]')"
          flutter build apk --release \
            --dart-define=API_BASE_URL="${API_URL}" \
            --dart-define=WS_BASE_URL="${WS_URL}" \
            --dart-define=ENABLE_FCM=true
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="${API_URL}" \
            --dart-define=WS_BASE_URL="${WS_URL}" \
            --dart-define=ENABLE_FCM=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodapp-courier-apk
          path: apps/courier_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodapp-courier-aab
          path: apps/courier_mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
