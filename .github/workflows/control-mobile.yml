# Isolated CI for FoodApp Control (apps/control_mobile only).
# Does not build or test other monorepo apps. Does not deploy.

name: Control Mobile

on:
  push:
    branches: [main]
    paths:
      - 'apps/control_mobile/**'
      - '.github/workflows/control-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/control_mobile/**'
      - '.github/workflows/control-mobile.yml'
  workflow_dispatch:

concurrency:
  group: control-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-web:
    name: Analyze, test, and build Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control_mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require CONTROL_API_BASE_URL repository variable
        env:
          CONTROL_API_BASE_URL: ${{ vars.CONTROL_API_BASE_URL }}
        run: |
          if [ -z "${CONTROL_API_BASE_URL// }" ]; then
            echo "::error::Repository variable CONTROL_API_BASE_URL is not set."
            echo "Set it under Settings → Secrets and variables → Actions → Variables."
            echo "Example value: https://foodapp.uz/api/v1"
            echo "Use a public API base URL (not a secret). Do not use localhost in CI."
            exit 1
          fi
          case "${CONTROL_API_BASE_URL}" in
            *localhost*|*127.0.0.1*|*10.0.2.2*)
              echo "::error::CONTROL_API_BASE_URL must not point at localhost."
              exit 1
              ;;
          esac
          echo "CONTROL_API_BASE_URL is configured (value not printed)."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-control-web-${{ runner.os }}-${{ hashFiles('apps/control_mobile/pubspec.lock') }}

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Flutter Web (release)
        env:
          CONTROL_API_BASE_URL: ${{ vars.CONTROL_API_BASE_URL }}
        run: |
          API_URL="$(printf '%s' "${CONTROL_API_BASE_URL}" | tr -d '[:space:]')"
          flutter build web --release \
            --dart-define=API_BASE_URL="${API_URL}"

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodapp-control-web
          path: apps/control_mobile/build/web
          if-no-files-found: error
          retention-days: 7

  # Separate job: Web must not wait on Android. No production signing.
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control_mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require and probe CONTROL_API_BASE_URL
        env:
          CONTROL_API_BASE_URL: ${{ vars.CONTROL_API_BASE_URL }}
        run: |
          if [ -z "${CONTROL_API_BASE_URL// }" ]; then
            echo "::error::Repository variable CONTROL_API_BASE_URL is not set."
            echo "Set it under Settings → Secrets and variables → Actions → Variables."
            echo "Example value: https://foodapp.uz/api/v1"
            echo "Use a public API base URL (not a secret). Do not use localhost in CI."
            exit 1
          fi
          case "${CONTROL_API_BASE_URL}" in
            *localhost*|*127.0.0.1*|*10.0.2.2*)
              echo "::error::CONTROL_API_BASE_URL must not point at localhost."
              exit 1
              ;;
          esac
          API_URL="$(printf '%s' "${CONTROL_API_BASE_URL}" | tr -d '[:space:]')"
          case "${API_URL}" in
            https://*) ;;
            *)
              echo "::error::CONTROL_API_BASE_URL must start with https://"
              exit 1
              ;;
          esac
          # Normalize for health probe (same rule as AppConfig).
          HEALTH_BASE="${API_URL%/}"
          case "${HEALTH_BASE}" in
            */api/v1) ;;
            *) HEALTH_BASE="${HEALTH_BASE}/api/v1" ;;
          esac
          echo "Probing ${HEALTH_BASE}/health (URL ok to print; not a secret)."
          curl -fsS --connect-timeout 15 "${HEALTH_BASE}/health" >/dev/null
          echo "CONTROL_API_BASE_URL is reachable."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-control-apk-${{ runner.os }}-${{ hashFiles('apps/control_mobile/pubspec.lock') }}

      - name: Flutter version
        run: flutter --version

      - name: Create Android platform project
        run: |
          flutter create . \
            --org com.foodapp \
            --project-name control_mobile \
            --platforms=android \
            --no-overwrite
          chmod +x scripts/patch_android_permissions.sh
          ./scripts/patch_android_permissions.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (debug-signed, no Play Store keys)
        env:
          CONTROL_API_BASE_URL: ${{ vars.CONTROL_API_BASE_URL }}
        run: |
          API_URL="$(printf '%s' "${CONTROL_API_BASE_URL}" | tr -d '[:space:]')"
          # android/ is gitignored; no production keystore. Flutter uses the
          # debug signing config for release when key.properties is absent.
          # Suitable for internal install only — not for Play Store publishing.
          flutter build apk --release \
            --dart-define=API_BASE_URL="${API_URL}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodapp-control-apk
          path: apps/control_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
