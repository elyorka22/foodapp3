upstream api_backend {
    server api:4000;
}

upstream web_frontend {
    server web:3000;
}

# WebSocket upgrade helper for Socket.IO
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1) HTTP endpoint: redirect everything to HTTPS
server {
    listen 80;
    server_name foodapp.uz www.foodapp.uz;

    return 301 https://foodapp.uz$request_uri;
}

# 2) HTTPS endpoint: SSL termination + reverse proxy
server {
    listen 443 ssl http2;
    server_name foodapp.uz www.foodapp.uz;

    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/foodapp.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodapp.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/foodapp.uz/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
